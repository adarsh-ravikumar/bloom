<div id="app">
  <div class="widget"> [BUTTON WIDGET]
    <button class="platform"> [<:button ... >]
      <div class="widget"> [TEXT WIDGET]
        <div class="widget"> [CONTAINER WIDGET]
          <div class="platform" style="outline: 2px solid limegreen; background: yellow"> [<:div ... >]
            <div class="slot"> [SLOT:HEADER (container)]
              <div class="slot"> [SLOT:HEADER (text)]
                <div class="parts"> [PARTS (button)]
                  <span
                    ><br />
                    magical!<br />
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="platform" test="" style="background-color: blue; color: white"> [<:div ...> (text)]
          <div class="slot"> [SLOT:COUNTER (text)]
            <div class="parts"> [PARTS (button)]
              <span
                ><br />
                Counter: </span
              ><span>1</span>
            </div>
          </div>
        </div>
        <div class="parts"> [PARTS (text)]
          <span><br /><br />Some text in the middle cuz why not!<br /><br /></span>
        </div>
        <div class="platform" style="background-color: red; color: white"> [<div ...> (text)]
          <div class="parts"> [PARTS (text)]
            <span
              ><br />
              Hallo!<br
            /></span>
          </div>
        </div>
      </div>
    </button>
  </div>
</div>
